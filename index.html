<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:Arial,sans-serif;touch-action:manipulation;transition:background 0.8s;background-size:cover;background-position:center}
.avatar-box{display:none;position:fixed;top:50%;right:8px;transform:translateY(-50%);z-index:10;text-align:center}
.avatar-box.show{display:block}
.avatar-box img{width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid #e94560;box-shadow:0 0 20px rgba(233,69,96,0.5)}
.avatar-box .label{color:#fff;font-size:12px;margin-top:4px;text-shadow:0 0 6px #000}
body.themed{/* kept for compat */}
#game{display:flex;flex-direction:column;align-items:center;gap:12px}
#info{display:flex;gap:20px;color:#fff;font-size:18px;font-weight:bold;flex-wrap:wrap;justify-content:center}
#info span{color:#e94560}
canvas{border:2px solid #e94560;background:#0f0f1a;display:block;max-width:90vw;max-height:60vh}
#controls{display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px}
.row{display:flex;gap:8px;justify-content:center}
.btn{font-size:20px;font-weight:bold;border:none;border-radius:12px;background:#16213e;color:#e94560;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;min-height:52px;display:flex;align-items:center;justify-content:center;padding:12px 6px;min-width:48px}
.btn:active{background:#e94560;color:#fff}
.btn.arr{font-size:26px;min-height:52px;min-width:52px;flex:1;max-width:60px}
.btn.side{flex:1;max-width:80px;font-size:16px}
.btn.accent{background:#e94560;color:#fff}
.btn.accent:active{background:#ff6b6b}
#game.themed canvas{border-color:rgba(255,255,255,0.6)}
.top-row{justify-content:space-between!important;align-items:center}
.spacer{width:80px;min-width:48px}
.rot-wrap{margin-left:8px}
@media(min-width:768px){#controls{display:none}}
</style>

function newBoard(){return Array.from({length:ROWS},()=>Array(COLS).fill(0))}
function spawn(){
  const id=Math.floor(Math.random()*PIECES.length);
  piece=PIECES[id].map(r=>[...r]);
  px=Math.floor((COLS-piece[0].length)/2);
  py=0;
  if(collide()){gameOver=true;clearInterval(timer)}
}
function collide(){
  for(let y=0;y<piece.length;y++)
    for(let x=0;x<piece[y].length;x++)
      if(piece[y][x]&&(py+y>=ROWS||px+x<0||px+x>=COLS||board[py+y]&&board[py+y][px+x]))return true;
  return false;
}
function lock(){
  for(let y=0;y<piece.length;y++)
    for(let x=0;x<piece[y].length;x++)
      if(piece[y][x])board[py+y][px+x]=piece[y][x]?COLORS.indexOf(COLORS[piece.length])+1:0;
  let cleared=0;
  for(let y=ROWS-1;y>=0;y--){
    if(board[y].every(c=>c)){
      board.splice(y,1);board.unshift(Array(COLS).fill(0));
      cleared++;y++;
    }
  }
  if(cleared){score+=[0,100,300,500,800][cleared];lines+=cleared}
  spawn();
}
function move(dx,dy){
  px+=dx;py+=dy;
  if(collide()){px-=dx;py-=dy;if(dy)lock();return dy?false:true}
  return true;
}
function rotate(){
  const rot=piece[0].map((_,i)=>piece.map(r=>r[i]).reverse());
  const old=piece;piece=rot;
  if(collide())piece=old;
}
function drop(){while(move(0,1));}
function draw(){
  ctx.fillStyle='#0f0f1a';ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)
    if(board[y][x]){ctx.fillStyle=COLORS[board[y][x]];ctx.fillRect(x*BS+1,y*BS+1,BS-2,BS-2)}
  if(!gameOver&&piece)for(let y=0;y<piece.length;y++)for(let x=0;x<piece[y].length;x++)
    if(piece[y][x]){ctx.fillStyle=COLORS[piece.length];ctx.fillRect((px+x)*BS+1,(py+y)*BS+1,BS-2,BS-2)}
  if(gameOver){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#e94560';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.fillText('游戏结束',canvas.width/2,canvas.height/2-16);ctx.font='16px Arial';ctx.fillStyle='#fff';ctx.fillText('点击画面重新开始',canvas.width/2,canvas.height/2+20)}
  document.getElementById('score').textContent=score;
  document.getElementById('lines').textContent=lines;
  // 红色(200分右上角) → 3张金色(右上角) → 3张蓝色(左右) → 3张绿色(不消失)
  while(score>=nextPhotoScore){
    // 红色小图，右上角排列
    let p=document.createElement('img');
    p.src=PHOTO_URL;
    p.style.cssText='position:fixed;width:55px;height:55px;border-radius:50%;object-fit:cover;border:2px solid #e94560;box-shadow:0 0 12px rgba(233,69,96,0.6);z-index:5;pointer-events:none';
    let rCol=popupPhotos.length%4,rRow=Math.floor(popupPhotos.length/4);
    p.style.right=(10+rCol*65)+'px';
    p.style.top=(10+rRow*65)+'px';
    document.body.appendChild(p);
    popupPhotos.push(p);
    nextPhotoScore+=200;
    // 每3张红色 → 1张金色
    if(popupPhotos.length>=3){
      popupPhotos.forEach(img=>img.remove());
      popupPhotos=[];
      let m=document.createElement('img');
      m.src=MERGE_URL;
      m.style.cssText='position:fixed;width:75px;height:75px;border-radius:12px;object-fit:cover;border:3px solid #f9ca24;box-shadow:0 0 18px rgba(249,202,36,0.7);z-index:6;pointer-events:none';
      let gCol=mergeCount%4,gRow=Math.floor(mergeCount/4);
      m.style.right=(10+gCol*85)+'px';
      m.style.top=(10+gRow*85)+'px';
      document.body.appendChild(m);
      goldenPhotos.push(m);
      mergeCount++;
      // 每3张金色 → 1张蓝色（左右排列）
      if(goldenPhotos.length>=3){
        goldenPhotos.forEach(img=>img.remove());
        goldenPhotos=[];
        let f=document.createElement('img');
        f.src=FINAL_URL;
        f.style.cssText='position:fixed;width:80px;height:80px;border-radius:8px;object-fit:cover;border:3px solid #00d2ff;box-shadow:0 0 20px rgba(0,210,255,0.7);z-index:7;pointer-events:none';
        let side=finalCount%2;
        let bPos=Math.floor(finalCount/2);
        if(side===0){f.style.left='5px'}else{f.style.right='5px'}
        f.style.top=(5+bPos*90)+'px';
        document.body.appendChild(f);
        // 跟踪蓝色图
        if(!window._blueImgs)window._blueImgs=[];
        window._blueImgs.push(f);
        finalCount++;
        // 每3张蓝色 → 1张绿色（不消失）
        if(window._blueImgs.length>=3){
          window._blueImgs.forEach(img=>img.remove());
          window._blueImgs=[];
          let g=document.createElement('img');
          g.src=GREEN_URL;
          g.style.cssText='position:fixed;width:90px;height:90px;border-radius:8px;object-fit:cover;border:3px solid #00ff88;box-shadow:0 0 25px rgba(0,255,136,0.7);z-index:8;pointer-events:none';
          let grCol=window._greenCount||0;
          g.style.right=(10+(grCol%4)*100)+'px';
          g.style.bottom=(10+Math.floor(grCol/4)*100)+'px';
          document.body.appendChild(g);
          window._greenCount=(window._greenCount||0)+1;
        }
      }
    }
  }
  }
  if(score>highScore){highScore=score;localStorage.setItem('tetrisHigh',highScore)}
  document.getElementById('hscore').textContent=highScore;
}
function tick(){if(!paused&&!gameOver){move(0,1);draw()}}
function restart(){board=newBoard();score=0;lines=0;gameOver=false;paused=false;clearInterval(timer);timer=setInterval(tick,400);spawn();highScore=parseInt(localStorage.getItem('tetrisHigh')||'0');document.body.classList.remove('themed');document.getElementById('avatar').classList.remove('show');nextPhotoScore=200;popupPhotos=[];goldenPhotos=[];mergeCount=0;finalCount=0;document.querySelectorAll('img[style*=\"position:fixed\"]').forEach(e=>e.remove());draw()}

// 键盘
document.addEventListener('keydown',e=>{
  if(gameOver){if(e.key==='r')restart();return}
  if(e.key==='p'){paused=!paused;return}
  if(paused)return;
  switch(e.key){
    case 'ArrowLeft':move(-1,0);break;case 'ArrowRight':move(1,0);break;
    case 'ArrowDown':move(0,1);break;case 'ArrowUp':rotate();break;
    case ' ':drop();break;
  }
  draw();
});

// 触屏按钮
document.getElementById('left').addEventListener('pointerdown',e=>{e.preventDefault();if(!paused&&!gameOver){move(-1,0);draw()}});
document.getElementById('right').addEventListener('pointerdown',e=>{e.preventDefault();if(!paused&&!gameOver){move(1,0);draw()}});
document.getElementById('down').addEventListener('pointerdown',e=>{e.preventDefault();if(!paused&&!gameOver){move(0,1);draw()}});
document.getElementById('up').addEventListener('pointerdown',e=>{e.preventDefault();if(!paused&&!gameOver){rotate();draw()}});
document.getElementById('rot').addEventListener('pointerdown',e=>{e.preventDefault();if(!paused&&!gameOver){rotate();draw()}});
document.getElementById('drop').addEventListener('pointerdown',e=>{e.preventDefault();if(!paused&&!gameOver){drop();draw()}});
document.getElementById('pause').addEventListener('pointerdown',e=>{e.preventDefault();if(!gameOver){paused=!paused;draw()}});
document.getElementById('restart').addEventListener('pointerdown',e=>{e.preventDefault();restart()});
// 防止双击缩放
document.querySelectorAll('.btn').forEach(b=>b.addEventListener('touchstart',e=>e.preventDefault()));
// 游戏区域滑动 / 点击重开
let sy=0;
canvas.addEventListener('touchstart',e=>{e.preventDefault();sy=e.touches[0].clientY});
canvas.addEventListener('touchmove',e=>{e.preventDefault()});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  if(gameOver){restart();return}
  if(paused)return;
  const dy=e.changedTouches[0].clientY-sy;
  if(dy>30)drop();
});
canvas.addEventListener('click',e=>{if(gameOver)restart()});

restart();
</script>

<script>
// 强制清除旧 Service Worker 和缓存，然后注册新版
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{
    return Promise.all(regs.map(r=>r.unregister()));
  }).then(()=>{
    return caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k))));
  }).then(()=>{
    navigator.serviceWorker.register('sw.js?t=3');
  });
}
</script>
