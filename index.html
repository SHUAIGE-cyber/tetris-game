<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>俄罗斯方块</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:Arial,sans-serif;touch-action:manipulation}
#game{display:flex;flex-direction:column;align-items:center;gap:10px}
#info{display:flex;gap:16px;color:#fff;font-size:17px;font-weight:bold}
#info span{color:#e94560}
canvas{border:2px solid #e94560;background:#0f0f1a;display:block;max-width:90vw;max-height:55vh}
#controls{display:flex;flex-direction:column;gap:7px;width:100%;max-width:340px}
.row{display:flex;gap:7px;justify-content:center}
.top-row{justify-content:space-between!important;align-items:center}
.spacer{width:80px}
.rot-wrap{margin-left:8px}
.btn{font-size:20px;font-weight:bold;border:none;border-radius:12px;background:#16213e;color:#e94560;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;min-height:52px;display:flex;align-items:center;justify-content:center;padding:12px 6px;min-width:48px}
.btn:active{background:#e94560;color:#fff}
.btn.arr{font-size:26px;min-width:52px;flex:1;max-width:60px}
.btn.side{flex:1;max-width:80px;font-size:16px}
.btn.accent{background:#e94560;color:#fff}
@media(min-width:768px){#controls{display:none}}
</style>
</head>
<body>
<div id="game">
<div id="info">得分 <span id="score">0</span> 行数 <span id="lines">0</span> | 累计 <span id="tscore">0</span></div>
<canvas id="c"></canvas>
<div id="controls">
<div class="row top-row">
<span class="rot-wrap"><button class="btn side" id="rot">↻ 旋转</button></span>
<button class="btn arr" id="up" style="font-size:30px">↑</button>
<span class="spacer"></span>
</div>
<div class="row">
<button class="btn arr" id="left">←</button>
<button class="btn arr" id="down">↓</button>
<button class="btn arr" id="right">→</button>
</div>
<div class="row">
<button class="btn side" id="pause">⏯</button>
<button class="btn side" id="drop">⚡ 硬降</button>
</div>
<div class="row">
<button class="btn accent" id="restart" style="flex:1;max-width:200px">🔄 新开一局</button>
</div>
</div>
</div>
<div id="quiz" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:9999;flex-direction:column;align-items:center;justify-content:center;gap:24px">
<div style="color:#fff;font-size:24px;font-weight:bold;text-align:center;padding:0 20px">你是大骚逼吗？</div>
<button id="qA" style="padding:18px 44px;font-size:22px;border-radius:14px;border:none;background:#16213e;color:#fff;cursor:pointer;font-weight:bold;min-width:200px">A. 是</button>
<button id="qB" style="padding:18px 44px;font-size:22px;border-radius:14px;border:none;background:#e94560;color:#fff;cursor:pointer;font-weight:bold;min-width:200px">B. 我是最骚的骚逼</button>
</div>

let goldCount=0,blueCount=0,greenCount=0,img1Count=0,img2Count=0;
let quizDone=false,quizLocked=false;

function pop(src,size,borderColor,z,count){
  var d=document.createElement('img');
  d.src=src;
  var s=size+'px';
  d.style.cssText='position:fixed;width:'+s+';height:'+s+';border-radius:8px;object-fit:cover;border:3px solid '+borderColor+';box-shadow:0 0 18px '+borderColor+';z-index:'+z+';pointer-events:none';
  var col=count%5,row=Math.floor(count/5),gap=size+8;
  d.style.right=(8+col*gap)+'px';d.style.top=(8+row*gap)+'px';
  document.body.appendChild(d);return d;
}

function newBoard(){return Array.from({length:ROWS},function(){return Array(COLS).fill(0)})}
function spawn(){
  var id=Math.floor(Math.random()*PIECES.length);
  piece=PIECES[id].map(function(r){return r.slice()});
  px=Math.floor((COLS-piece[0].length)/2);py=0;
  if(collide()){gameOver=true;clearInterval(timer)}
}
function collide(){
  for(var y=0;y<piece.length;y++)
    for(var x=0;x<piece[y].length;x++)
      if(piece[y][x]&&(py+y>=ROWS||px+x<0||px+x>=COLS||(board[py+y]&&board[py+y][px+x])))return true;
  return false;
}
function lock(){
  for(var y=0;y<piece.length;y++)
    for(var x=0;x<piece[y].length;x++)
      if(piece[y][x])board[py+y][px+x]=COLORS.indexOf(COLORS[piece.length])+1;
  var cleared=0;
  for(var y=ROWS-1;y>=0;y--){
    if(board[y].every(function(c){return c})){board.splice(y,1);board.unshift(Array(COLS).fill(0));cleared++;y++;}
  }
  if(cleared){score+=[0,100,300,500,800][cleared];lines+=cleared}
  spawn();
}
function move(dx,dy){
  px+=dx;py+=dy;
  if(collide()){px-=dx;py-=dy;if(dy)lock();return dy?false:true}
  return true;
}
function rotate(){
  var rot=piece[0].map(function(_,i){return piece.map(function(r){return r[i]}).reverse()});
  var old=piece;piece=rot;
  if(collide())piece=old;
}
function drop(){while(move(0,1));}
function draw(){
  ctx.fillStyle='#0f0f1a';ctx.fillRect(0,0,canvas.width,canvas.height);
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++)
    if(board[y][x]){ctx.fillStyle=COLORS[board[y][x]];ctx.fillRect(x*BS+1,y*BS+1,BS-2,BS-2)}
  if(!gameOver&&piece)for(var y=0;y<piece.length;y++)for(var x=0;x<piece[y].length;x++)
    if(piece[y][x]){ctx.fillStyle=COLORS[piece.length];ctx.fillRect((px+x)*BS+1,(py+y)*BS+1,BS-2,BS-2)}
  if(gameOver&&!quizLocked){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#e94560';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.fillText('游戏结束',canvas.width/2,canvas.height/2-16);ctx.font='16px Arial';ctx.fillStyle='#fff';ctx.fillText('点击画面重新开始',canvas.width/2,canvas.height/2+20)}
  document.getElementById('score').textContent=score;
  document.getElementById('lines').textContent=lines;
  document.getElementById('tscore').textContent=(totalScore||0)+score;
  while(score>=nextPhoto){
    var r=pop(RED_URL,50,'#e94560',5,reds.length);reds.push(r);nextPhoto+=200;
    if(reds.length>=3){
      reds.forEach(function(p){p.remove()});reds=[];
      var g=pop(GOLD_URL,65,'#f9ca24',6,goldCount);golds.push(g);goldCount++;
      if(golds.length>=3){
        golds.forEach(function(p){p.remove()});golds=[];
        var b=pop(BLUE_URL,75,'#00d2ff',7,blueCount);blues.push(b);blueCount++;
        if(blues.length>=3){
          blues.forEach(function(p){p.remove()});blues=[];
          var gr=pop(GREEN_URL,85,'#00ff88',8,greenCount);greens.push(gr);greenCount++;
          if(greens.length>=3){
            greens.forEach(function(p){p.remove()});greens=[];
            var i1=pop(IMG1_URL,90,'#ff8800',9,img1Count);img1s.push(i1);img1Count++;
            if(img1s.length>=3){
              img1s.forEach(function(p){p.remove()});img1s=[];
              var i2=pop(IMG2_URL,95,'#ff00ff',10,img2Count);img2s.push(i2);img2Count++;
              if(img2s.length>=3){
                img2s.forEach(function(p){p.remove()});img2s=[];
                quizLocked=true;gameOver=true;paused=true;clearInterval(timer);
                document.getElementById('quiz').style.display='flex';
              }
            }
          }
        }
      }
    }
  }
}
function tick(){if(!paused&&!gameOver){move(0,1);draw()}}
function restart(){
  if(quizLocked)return;
  totalScore=(totalScore||0)+score;localStorage.setItem('tetrisTotal',totalScore);document.getElementById('tscore').textContent=totalScore;
  board=newBoard();score=0;lines=0;gameOver=false;paused=false;
  clearInterval(timer);timer=setInterval(tick,400);spawn();
  nextPhoto=200;
  [reds,golds,blues,greens,img1s,img2s].forEach(function(arr){arr.forEach(function(p){p.remove()})});
  reds=[];golds=[];blues=[];greens=[];img1s=[];img2s=[];
  goldCount=blueCount=greenCount=img1Count=img2Count=0;
  draw();
}

document.addEventListener('keydown',function(e){
  if(gameOver){if(e.key==='r'&&!quizLocked)restart();return}
  if(e.key==='p'){paused=!paused;return}
  if(paused)return;
  if(e.key==='ArrowLeft')move(-1,0);
  else if(e.key==='ArrowRight')move(1,0);
  else if(e.key==='ArrowDown')move(0,1);
  else if(e.key==='ArrowUp')rotate();
  else if(e.key===' ')drop();
  draw();
});

document.getElementById('left').addEventListener('pointerdown',function(e){e.preventDefault();if(!paused&&!gameOver){move(-1,0);draw()}});
document.getElementById('right').addEventListener('pointerdown',function(e){e.preventDefault();if(!paused&&!gameOver){move(1,0);draw()}});
document.getElementById('down').addEventListener('pointerdown',function(e){e.preventDefault();if(!paused&&!gameOver){move(0,1);draw()}});
document.getElementById('up').addEventListener('pointerdown',function(e){e.preventDefault();if(!paused&&!gameOver){rotate();draw()}});
document.getElementById('rot').addEventListener('pointerdown',function(e){e.preventDefault();if(!paused&&!gameOver){rotate();draw()}});
document.getElementById('drop').addEventListener('pointerdown',function(e){e.preventDefault();if(!paused&&!gameOver){drop();draw()}});
document.getElementById('pause').addEventListener('pointerdown',function(e){e.preventDefault();if(!gameOver){paused=!paused;draw()}});
document.getElementById('restart').addEventListener('pointerdown',function(e){e.preventDefault();if(!quizLocked)restart()});
document.getElementById('qA').addEventListener('pointerdown',function(e){e.preventDefault();alert('你还是选B吧，A不适合你！')});
document.getElementById('qB').addEventListener('pointerdown',function(e){e.preventDefault();
  document.getElementById('quiz').style.display='none';
  document.body.style.background='#f9ca24';
  quizDone=true;quizLocked=false;gameOver=false;paused=false;
  timer=setInterval(tick,400);spawn();draw();
});

document.querySelectorAll('.btn,#qA,#qB').forEach(function(b){b.addEventListener('touchstart',function(e){e.preventDefault()})});

var sy=0;
canvas.addEventListener('touchstart',function(e){e.preventDefault();sy=e.touches[0].clientY});
canvas.addEventListener('touchmove',function(e){e.preventDefault()});
canvas.addEventListener('touchend',function(e){
  e.preventDefault();
  if(gameOver){if(!quizLocked)restart();return}
  if(paused)return;
  if(e.changedTouches[0].clientY-sy>30)drop();
});
canvas.addEventListener('click',function(e){if(gameOver&&!quizLocked)restart()});

restart();
</script>
</body>
